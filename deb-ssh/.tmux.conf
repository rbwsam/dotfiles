# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Split panes in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Makes scroll wheel/trackpad scroll Claude Code's output
set -g mouse on

# Big scrollback buffer for long Claude conversations
set -g history-limit 50000

set-option -g renumber-windows on

# Shift+PgUp/PgDn scroll scrollback like a bare terminal. Alacritty forwards
# these as escapes once tmux is on the alternate screen. -e leaves copy mode at
# the bottom; Any leaves it on any other keypress, which eats that keystroke.
bind -n S-PPage copy-mode -eu
bind -T copy-mode-vi S-PPage send-keys -X page-up
bind -T copy-mode-vi S-NPage send-keys -X page-down
bind -T copy-mode-vi Any     send-keys -X cancel

# git branch | basename(path)  (branch green, path blue)
set -g status-right '#(~/.tmux/status-right.sh "#{pane_current_path}")'
