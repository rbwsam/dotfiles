[font]
size = 11

[font.normal]
family = "Noto Sans Mono"

[window]
padding.x = 8
padding.y = 8

[terminal]

[terminal.shell]
args = ["--login"]
program = "/bin/bash"

[colors]

[colors.primary]
background = "#000000"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[bell]
duration = 0
command = { program = "sh", args = ["-c", 'exec paplay "$HOME/.config/alacritty/bell.wav"'] }
